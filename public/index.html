<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to Anki Converter</title>

</head>

<body>
    <section class="section">
        <div class="container">
            <h1 class="title">Markdown to Anki Converter</h1>
            <p class="subtitle">Convert Markdown notes into Anki flashcards</p>

            <div class="file has-name is-fullwidth mb-5">
                <label class="file-label">
                    <input class="file-input" type="file" id="fileInput" accept=".md">
                    <span class="file-cta">
                        <span class="file-icon">
                            <i class="fas fa-upload"></i>
                        </span>
                        <span class="file-label">
                            Choose a file…
                        </span>
                    </span>
                    <span class="file-name" id="fileName">
                        No file uploaded
                    </span>
                </label>
            </div>

            <div class="columns" id="mainContent" style="display: none;">
                <div class="column is-one-third">
                    <h2 class="title is-4">Parsed Cards (<span id="cardCount">0</span>)</h2>
                    <aside class="menu">
                        <ul class="menu-list" id="cardList">
                            <!-- List items will be injected here -->
                        </ul>
                    </aside>
                </div>
                <div class="column">
                    <h2 class="title is-4">Preview</h2>
                    <div class="tabs is-toggle is-fullwidth mb-2">
                        <ul>
                            <li class="is-active" data-tab="front"><a>Front</a></li>
                            <li data-tab="back"><a>Back</a></li>
                        </ul>
                    </div>
                    <div class="box"
                        style="background: #e0e0e0; min-height: 300px; display: flex; justify-content: center; align-items: center;">
                        <div id="previewContainer"></div>
                    </div>

                    <hr>

                    <div class="buttons">
                        <button class="button is-link" id="downloadApkgBtn">Download Anki Deck (.apkg)</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
